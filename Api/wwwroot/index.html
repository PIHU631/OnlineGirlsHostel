<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        .loader {
            margin-top: 10px;
            font-weight: bold;
            color: #0984e3;
        }

        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

            .card i {
                font-size: 28px;
                color: #0984e3;
            }

            .card h3 {
                margin: 0;
                font-size: 14px;
                color: #888;
            }

            .card p {
                font-size: 22px;
                font-weight: bold;
                margin-top: 5px;
            }

        .card-text {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <h2><i class="fa-solid fa-building"></i> Hostel</h2>

            <a href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="girls.html" class="active"><i class="fa-solid fa-user"></i> Girls</a>
            <a href="hostels.html"><i class="fa-solid fa-hotel"></i> Hostels</a>
            <a href="rooms.html"><i class="fa-solid fa-bed"></i> Rooms</a>
            <a href="room-history.html"><i class="fa-solid fa-clock-rotate-left"></i> Room History</a>
            <a href="staff.html"><i class="fa-solid fa-user-tie"></i> Staff</a>
            <a href="entrylog.html"><i class="fa-solid fa-right-from-bracket"></i> Entry Logs</a>
            <a href="foodattendance.html"><i class="fa-solid fa-utensils"></i> Food Attendance</a>
            <a href="hostelattendance.html"><i class="fa-solid fa-clipboard-check"></i> Hostel Attendance</a>
            <a href="marketvisit.html"><i class="fa-solid fa-store"></i> Market Visit</a>
            <a href="visitor.html"><i class="fa-solid fa-users"></i> Visitors</a>
        </div>

        <!-- Main -->
        <div class="main">

            <!-- Header -->
            <div class="header">
                <h1><i class="fa-solid fa-chart-line"></i> Dashboard</h1>
            </div>

            <!-- Alert -->
            <div id="errorBox" class="alert error-alert hidden"></div>

            <!-- Loader -->
            <div id="loader" class="loader hidden">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading...
            </div>

            <!-- Cards -->
            <div class="card-container">

                <div class="card">
                    <div class="card-text">
                        <h3>Total Girls</h3>
                        <p id="totalGirls">0</p>
                    </div>
                    <i class="fa-solid fa-users"></i>
                </div>

                <div class="card">
                    <div class="card-text">
                        <h3>Active Girls</h3>
                        <p id="activeGirls">0</p>
                    </div>
                    <i class="fa-solid fa-user-check"></i>
                </div>

                <div class="card">
                    <div class="card-text">
                        <h3>Inactive Girls</h3>
                        <p id="inactiveGirls">0</p>
                    </div>
                    <i class="fa-solid fa-user-xmark"></i>
                </div>

                <div class="card">
                    <div class="card-text">
                        <h3>Rooms Occupied</h3>
                        <p id="roomsUsed">0</p>
                    </div>
                    <i class="fa-solid fa-bed"></i>
                </div>

            </div>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/dashboard.js"></script>

</body>
</html>
