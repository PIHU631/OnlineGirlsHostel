<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Attendance</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        .loader {
            margin-top: 10px;
            font-weight: bold;
            color: #0984e3;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

            .search-box input {
                border: none;
                outline: none;
            }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <h2><i class="fa-solid fa-building"></i> Hostel</h2>

            <a href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="girls.html" class="active"><i class="fa-solid fa-user"></i> Girls</a>
            <a href="hostels.html"><i class="fa-solid fa-hotel"></i> Hostels</a>
            <a href="rooms.html"><i class="fa-solid fa-bed"></i> Rooms</a>
            <a href="room-history.html"><i class="fa-solid fa-clock-rotate-left"></i> Room History</a>
            <a href="staff.html"><i class="fa-solid fa-user-tie"></i> Staff</a>
            <a href="entrylog.html"><i class="fa-solid fa-right-from-bracket"></i> Entry Logs</a>
            <a href="foodattendance.html"><i class="fa-solid fa-utensils"></i> Food Attendance</a>
            <a href="hostelattendance.html"><i class="fa-solid fa-clipboard-check"></i> Hostel Attendance</a>
            <a href="marketvisit.html"><i class="fa-solid fa-store"></i> Market Visit</a>
            <a href="visitor.html"><i class="fa-solid fa-users"></i> Visitors</a>
        </div>

        <!-- Main -->
        <div class="main">

            <!-- Header -->
            <div class="header">

                <div class="header-left">
                    <h1><i class="fa-solid fa-clipboard-check"></i> Hostel Attendance</h1>

                    <div class="search-box">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search attendance...">
                    </div>
                </div>

                <button class="btn primary" onclick="openModal()">
                    <i class="fa-solid fa-plus"></i> Mark Attendance
                </button>
            </div>

            <!-- Alert -->
            <div id="alert" class="alert hidden"></div>

            <!-- Loader -->
            <div id="loader" class="loader hidden">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading...
            </div>

            <!-- Table -->
            <table>
                <thead>
                    <tr>
                        <th>Girl</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="attendanceTable"></tbody>
            </table>

        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal hidden" onclick="outsideClick(event)">
        <div class="modal-content" onclick="event.stopPropagation()">

            <h2><i class="fa-solid fa-clipboard-check"></i> Mark Attendance</h2>

            <div class="form-group">
                <label>Girl</label>
                <select id="girlId"></select>
                <small class="error" id="girlError"></small>
            </div>

            <div class="form-group">
                <label>Date</label>
                <input type="date" id="date">
                <small class="error" id="dateError"></small>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select id="isPresent">
                    <option value="">Select</option>
                    <option value="true">Present</option>
                    <option value="false">Absent</option>
                </select>
                <small class="error" id="statusError"></small>
            </div>

            <div class="modal-actions">
                <button class="btn danger" onclick="closeModal()">Cancel</button>
                <button class="btn primary" onclick="saveData()">Save</button>
            </div>

        </div>
    </div>

    <script src="js/hostelattendance.js"></script>

    <script>
        function outsideClick(e) {
            if (e.target.id === "modal") closeModal();
        }
    </script>

</body>
</html>
