<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Visits</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        .loader {
            margin-top: 10px;
            font-weight: bold;
            color: #0984e3;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

            .search-box input {
                border: none;
                outline: none;
            }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <h2><i class="fa-solid fa-building"></i> Hostel</h2>

            <a href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="girls.html" class="active"><i class="fa-solid fa-user"></i> Girls</a>
            <a href="hostels.html"><i class="fa-solid fa-hotel"></i> Hostels</a>
            <a href="rooms.html"><i class="fa-solid fa-bed"></i> Rooms</a>
            <a href="room-history.html"><i class="fa-solid fa-clock-rotate-left"></i> Room History</a>
            <a href="staff.html"><i class="fa-solid fa-user-tie"></i> Staff</a>
            <a href="entrylog.html"><i class="fa-solid fa-right-from-bracket"></i> Entry Logs</a>
            <a href="foodattendance.html"><i class="fa-solid fa-utensils"></i> Food Attendance</a>
            <a href="hostelattendance.html"><i class="fa-solid fa-clipboard-check"></i> Hostel Attendance</a>
            <a href="marketvisit.html"><i class="fa-solid fa-store"></i> Market Visit</a>
            <a href="visitor.html"><i class="fa-solid fa-users"></i> Visitors</a>
        </div>

        <!-- Main -->
        <div class="main">

            <!-- Header -->
            <div class="header">
                <div class="header-left">
                    <h1><i class="fa-solid fa-store"></i> Market Visits</h1>

                    <!-- Search -->
                    <div class="search-box">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" placeholder="Search..." id="searchInput">
                    </div>
                </div>

                <button class="btn primary" onclick="openModal()">
                    <i class="fa-solid fa-plus"></i> Add Visit
                </button>
            </div>

            <!-- Alert -->
            <div id="alertBox" class="alert hidden"></div>

            <!-- Loader -->
            <div id="loader" class="loader hidden">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading...
            </div>

            <!-- Table -->
            <table>
                <thead>
                    <tr>
                        <th>Girl</th>
                        <th>Out Time</th>
                        <th>In Time</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="visitTable">
                    <tr>
                        <td colspan="6">
                            <div class="empty">
                                <i class="fa-solid fa-store fa-2x"></i>
                                <p>No visits found</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>

    <!-- Modal -->
    <div id="visitModal" class="modal hidden" onclick="outsideClick(event)">
        <div class="modal-content" onclick="event.stopPropagation()">

            <h2><i class="fa-solid fa-store"></i> Market Visit</h2>

            <div class="form-group">
                <label>Girl</label>
                <select id="girlId"></select>
                <small class="error" id="girlError"></small>
            </div>

            <div class="form-group">
                <label>Out Time</label>
                <input type="datetime-local" id="outTime">
                <small class="error" id="outError"></small>
            </div>

            <div class="form-group">
                <label>Reason</label>
                <input type="text" id="reason">
                <small class="error" id="reasonError"></small>
            </div>

            <div class="modal-actions">
                <button class="btn danger" onclick="closeModal()">
                    <i class="fa-solid fa-xmark"></i> Cancel
                </button>
                <button class="btn primary" onclick="saveData()">
                    <i class="fa-solid fa-check"></i> Save
                </button>
            </div>

        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/marketvisit.js"></script>

    <script>
        function outsideClick(e) {
            const modal = document.getElementById("visitModal");
            if (e.target === modal) closeModal();
        }
    </script>

</body>
</html>
